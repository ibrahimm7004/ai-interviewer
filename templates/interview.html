<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Interview (Realtime)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ request.url_for('static', path='styles.css') }}">
</head>
<body>
  <div class="container-fluid vh-100 d-flex align-items-center justify-content-center main-bg">
    <div class="interview-container p-4 text-center">
      <h1 class="title mb-3">Your AI Interview</h1>
      <button id="start-interview-btn" class="btn btn-primary mb-4">Start My Interview</button>
      <button id="end-interview-btn" class="btn btn-danger mb-4" style="display: none;">End Interview</button>

      <div id="question-area" style="display:none; text-align:center;">
        <p id="current-question" class="question-text mb-4"></p>
      </div>

      <!-- plays the model's speech -->
      <audio id="ai-audio" autoplay></audio>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById("start-interview-btn");
    const endBtn = document.getElementById("end-interview-btn");
    const questionArea = document.getElementById("question-area");
    const currentQuestionEl = document.getElementById("current-question");
    const aiAudio = document.getElementById("ai-audio");

    let pc, dc;

    startBtn.addEventListener("click", async () => {
      startBtn.style.display = "none";
      endBtn.style.display = "inline-block";
      questionArea.style.display = "block";

      // 1. Ask backend for ephemeral session
      const sess = await fetch("/session").then(r => r.json());
      const EPHEMERAL_KEY = sess.client_secret.value;

      // 2. Capture mic
      const local = await navigator.mediaDevices.getUserMedia({ audio: true });

      // 3. PeerConnection
      pc = new RTCPeerConnection();
      local.getTracks().forEach(t => pc.addTrack(t, local));

      // remote audio (AI voice)
      pc.ontrack = (e) => {
        aiAudio.srcObject = e.streams[0];
      };

      // 4. Data channel for text events
      dc = pc.createDataChannel("oai-events");
      dc.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          // Realtime sends lots of events; pick out text responses
          if (msg.type === "response.output_text.delta" || msg.type === "response.output_text") {
            currentQuestionEl.innerText = (msg.text || "").trim();
          }
        } catch {
          console.log("Non-JSON event:", e.data);
        }
      };

      // 5. Offer/answer exchange
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      const resp = await fetch("https://api.openai.com/v1/realtime?model=gpt-realtime", {
        method: "POST",
        headers: {
          Authorization: `Bearer ${EPHEMERAL_KEY}`,
          "Content-Type": "application/sdp"
        },
        body: offer.sdp
      });

      const answer = {
        type: "answer",
        sdp: await resp.text()
      };
      await pc.setRemoteDescription(answer);
    });

    endBtn.addEventListener("click", () => {
      if (pc) pc.close();
      alert("Interview ended. Thank you!");
      location.reload();
    });
  </script>
</body>
</html>
